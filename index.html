<!DOCTYPE html>
<html>
<head>
    <title>Мой первый сайт</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #764ba2;
            font-size: 36px;
            margin-bottom: 10px;
        }
        p {
            color: #333;
            font-size: 18px;
            line-height: 1.6;
        }
        img {
            border-radius: 50%;
            width: 150px;
            height: 150px;
            object-fit: cover;
            border: 5px solid #667eea;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌟 Привет, мир!</h1>
        <p>Меня зовут <strong>Павел</strong>. Это мой первый сайт.</p>
        <p>Я учусь создавать сайты с нуля!</p>
        <img src="https://via.placeholder.com/300" alt="Моя картинка">
        <p style="font-size: 14px; color: #888; margin-top: 20px;">Сделано с ❤️</p>
    </div>
</body>
</html>
